[build-system]
requires = ["setuptools>=60.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-manager"
version = "0.1.0"
description = "NVIDIA Driver Manager — GUI tool for Debian/Ubuntu-based Linux distributions to manage NVIDIA drivers and monitor GPU status."
readme = "README.md"
requires-python = ">=3.8"
authors = [ { name = "kimocoder", email = "christian@aircrack-ng.org" } ]
license = "MIT"
keywords = ["nvidia", "drivers", "gpu", "nvidia-smi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Topic :: System :: Hardware",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
"Source" = "https://github.com/kimocoder/nvidia-manager"
"Homepage" = "https://github.com/kimocoder/nvidia-manager"

[project.scripts]
"nvidia-manager" = "nvidia_manager.cli:main"

[project.optional-dependencies]
# Optional compute dependencies (heavy native packages)
compute = ["pyopencl", "openvino"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
exclude = ["*.__pycache__", "*.__pycache__.*", "build*", "tests*"]
