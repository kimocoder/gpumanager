name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Quote version strings so YAML doesn't parse them as floats (3.10 -> 3.1)
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -r requirements-dev.txt || true
      - name: Run tests
        run: |
          export PYTHONPATH=.
          .venv/bin/pytest -q
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -r requirements-dev.txt || true
      - name: Run tests
        run: |
          export PYTHONPATH=.
          .venv/bin/pytest -q

  build-runner:
    runs-on: ubuntu-latest
    needs: test
    # Run for both pushes and pull requests so PRs validate the native runner build
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libvulkan-dev vulkan-tools vulkan-utility-libraries-dev spirv-tools glslang-tools
      - name: Build shader and runner
        run: |
          chmod +x benchmarks/vulkan_compute/build.sh
          benchmarks/vulkan_compute/build.sh
      - name: Validate build artifacts
        run: |
          # Ensure the runner binary was produced and is executable
          if [ ! -f benchmarks/vulkan_compute/runner ] || [ ! -x benchmarks/vulkan_compute/runner ]; then
            echo "ERROR: runner missing or not executable"
            ls -l benchmarks/vulkan_compute || true
            exit 1
          fi
          # Ensure shader was compiled
          if [ ! -f benchmarks/vulkan_compute/shader.spv ]; then
            echo "ERROR: shader.spv missing"
            ls -l benchmarks/vulkan_compute || true
            exit 1
          fi
      - name: Upload runner artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-runner
          path: |
            benchmarks/vulkan_compute/runner
            benchmarks/vulkan_compute/shader.spv

  validate-artifact:
    runs-on: ubuntu-latest
    needs: build-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download vulkan-runner artifact
        uses: actions/download-artifact@v4
        with:
          name: vulkan-runner
          path: ./artifacts
      - name: List artifact contents
        run: |
          echo "Contents of artifacts dir:"
          ls -l artifacts || true
          # If artifact zip had nested paths, find files
          find artifacts -maxdepth 3 -type f -print || true
      - name: Validate extracted files
        run: |
          # The download-artifact action extracts uploaded files into ./artifacts
          if [ ! -f artifacts/benchmarks/vulkan_compute/runner ] && [ ! -f artifacts/runner ]; then
            echo "ERROR: runner not found in artifact"
            ls -R artifacts || true
            exit 1
          fi
          if [ -f artifacts/benchmarks/vulkan_compute/runner ]; then
            ART_RUNNER=artifacts/benchmarks/vulkan_compute/runner
          else
            ART_RUNNER=artifacts/runner
          fi
          if [ ! -f artifacts/benchmarks/vulkan_compute/shader.spv ] && [ ! -f artifacts/shader.spv ]; then
            echo "ERROR: shader.spv not found in artifact"
            ls -R artifacts || true
            exit 1
          fi
          # Make sure runner is executable
          chmod +x "$ART_RUNNER"
          echo "Runner path: $ART_RUNNER"
          file "$ART_RUNNER" || true
          echo "Running health-check (may require Vulkan drivers to run successfully)"
      - name: Install Vulkan runtime libs (best-effort)
        run: |
          sudo apt-get update
          # Install minimal runtime libs for Vulkan; linking in build stage covered compile-time
          sudo apt-get install -y libvulkan1 || true
      - name: Run runner health-check
        run: |
          set -x
          # choose the artifact runner path we validated earlier
          if [ -f artifacts/benchmarks/vulkan_compute/runner ]; then
            ART_RUNNER=artifacts/benchmarks/vulkan_compute/runner
          elif [ -f artifacts/runner ]; then
            ART_RUNNER=artifacts/runner
          else
            echo "ERROR: runner not present"
            exit 1
          fi
          chmod +x "$ART_RUNNER"
          # Attempt a lightweight health-check; allow failure but capture output to assist debugging
          "$ART_RUNNER" --health-check || ( echo "Runner health-check failed (exit $?), see above"; exit 1 )
