name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Quote version strings so YAML doesn't parse them as floats (3.10 -> 3.1)
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -r requirements-dev.txt || true
      - name: Run tests
        run: |
          export PYTHONPATH=.
          .venv/bin/pytest -q

  build-runner:
    runs-on: ubuntu-latest
    needs: test
    # Run for both pushes and pull requests so PRs validate the native runner build
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libvulkan-dev vulkan-tools vulkan-utility-libraries-dev spirv-tools glslang-tools
      - name: Build shader and runner
        run: |
          chmod +x benchmarks/vulkan_compute/build.sh
          benchmarks/vulkan_compute/build.sh
      - name: Validate build artifacts
        run: |
          # Ensure the runner binary was produced and is executable
          if [ ! -f benchmarks/vulkan_compute/runner ] || [ ! -x benchmarks/vulkan_compute/runner ]; then
            echo "ERROR: runner missing or not executable"
            ls -l benchmarks/vulkan_compute || true
            exit 1
          fi
          # Ensure shader was compiled
          if [ ! -f benchmarks/vulkan_compute/shader.spv ]; then
            echo "ERROR: shader.spv missing"
            ls -l benchmarks/vulkan_compute || true
            exit 1
          fi
      - name: Upload runner artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-runner
          path: |
            benchmarks/vulkan_compute/runner
            benchmarks/vulkan_compute/shader.spv

