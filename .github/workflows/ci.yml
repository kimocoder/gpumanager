name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10, 3.11, 3.12]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -r requirements-dev.txt || true
      - name: Run tests
        run: |
          export PYTHONPATH=.
          .venv/bin/pytest -q

  build-runner:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libvulkan-dev vulkan-tools vulkan-utility-libraries-dev spirv-tools glslang-tools
      - name: Build shader and runner
        run: |
          chmod +x benchmarks/vulkan_compute/build.sh
          benchmarks/vulkan_compute/build.sh
      - name: Upload runner artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-runner
          path: |
            benchmarks/vulkan_compute/runner
            benchmarks/vulkan_compute/shader.spv

